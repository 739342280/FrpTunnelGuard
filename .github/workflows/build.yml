name: Build Frp Tunnel Guard

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil dnspython pillow pystray pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name FrpTunnelGuard --add-data "frpc.exe;." --add-data "frpc.toml;." guard.py

      - name: Package artifact (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FrpTunnelGuard\* -DestinationPath FrpTunnelGuard.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrpTunnelGuard
          path: FrpTunnelGuard.zip
          retention-days: 7   # 自动保留7天，可根据需要调整