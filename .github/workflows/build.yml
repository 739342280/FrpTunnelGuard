name: Build Frp Tunnel Guard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare frpc.toml for packaging
        run: copy frpc.toml.example frpc.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name FrpTunnelGuard guard.py

      - name: Copy external files to dist
        shell: cmd
        run: |
          copy frpc.exe dist\FrpTunnelGuard\frpc.exe
          copy frpc.toml dist\FrpTunnelGuard\frpc.toml

      - name: Package artifact (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FrpTunnelGuard\* -DestinationPath FrpTunnelGuard.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrpTunnelGuard
          path: FrpTunnelGuard.zip
          retention-days: 7