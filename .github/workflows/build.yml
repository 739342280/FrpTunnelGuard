name: Build Frp Tunnel Guard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 关键步骤：用模板文件生成临时的 frpc.toml 供打包
      - name: Prepare frpc.toml for packaging
        run: copy frpc.toml.example frpc.toml

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --name FrpTunnelGuard --add-data "frpc.exe;." --add-data "frpc.toml;." guard.py

      - name: Package artifact (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FrpTunnelGuard\* -DestinationPath FrpTunnelGuard.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrpTunnelGuard
          path: FrpTunnelGuard.zip
          retention-days: 7